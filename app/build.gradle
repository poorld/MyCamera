plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.android.mycamera'
    compileSdk 35

    defaultConfig {
        applicationId "com.android.mycamera"
        minSdk 30
        targetSdk 32
        versionCode 2
        versionName "1.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        archivesBaseName = "YourCamera"
    }

    signingConfigs {
        debug {
            storeFile file('platform.jks')
            storePassword 'luhongda1234'
            keyAlias 'luhongda'
            keyPassword 'luhongda1234'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Hidden platform APIs for system app build (not packaged into APK)
    compileOnly files('libs/framework-stubs.jar')

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // CameraX dependencies
    implementation libs.camera.core
    implementation libs.androidx.camera.camera2
    implementation libs.androidx.camera.lifecycle
    implementation libs.androidx.camera.view
    implementation libs.androidx.camera.video
    implementation libs.androidx.lifecycle.service
//    implementation libs.camera.camera2.interop

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}